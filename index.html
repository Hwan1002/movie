<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./mvstyle.css">
    <title>Hwanflix</title>
</head>
<body>

    <header class="fixed">
        <div class="hwanflix">
            <a href=""><h1>HWANFLIX</h1></a>
            <p>환석이의 환쁠릭스</p>
        </div>
        <div class="btns">
            <button type="button" class="searchBtn mainBtn">검색</button>
            <div class="mvSearch hide">
                <input type="text" placeholder="영화를 검색해보세요." class="searchKey" id="searchKey">
                <select id="typeFilter" aria-label="타입 필터">
                    <option value="">전체</option>
                    <option value="movie">영화</option>
                    <option value="series">시리즈</option>
                    <option value="episode">에피소드</option>
                </select>
                <select id="yearFilter" aria-label="연도 필터">
                    <option value="">연도</option>
                </select>
                <button type="button">Search</button>
            </div>
            <button type="button" class="favBtn mainBtn">즐겨찾기</button>
        </div>
        <!-- 최근 검색어 칩 (검색창이 열려 있을 때만 표시) -->
        <div class="recentKeywords hide"></div>
    </header>

    <main class="mvForm" id="mvForm">
        <div class="movies">
            <p class="sectionTitle hide"></p>
            <p class="errMsg hide">검색 결과가 없습니다.</p>
        </div>
        <div class="favorites hide"></div> <!-- 즐겨찾기 내용이 표시될 영역. 기본적으로 숨김 처리 -->
    </main>

    <!-- 검색/무한스크롤 로딩 스피너 -->
    <div class="loaderWrap hide">
        <div class="loader"></div>
    </div>

    <!-- 무한스크롤 감지용 센티널 -->
    <div class="sentinel"></div>

    <!-- 맨 위로 버튼 -->
    <button type="button" class="topBtn" aria-label="맨 위로">↑</button>

    <!-- 영화 상세 정보 모달 -->
    <div class="modalOverlay hide">
        <div class="modal"></div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast"></div>

    <script defer src="mvjs.js"></script>

</body>
</html>
